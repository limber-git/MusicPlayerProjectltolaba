org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# App versioning (optional override)
# APP_VERSION_CODE=1
# APP_VERSION_NAME=1.0.0

# Release signing (set these in ~/.gradle/gradle.properties or environment variables)
# RELEASE_STORE_FILE=C:/secure/release-keystore.jks
# RELEASE_STORE_PASSWORD=change-me
# RELEASE_KEY_ALIAS=release
# RELEASE_KEY_PASSWORD=change-me
